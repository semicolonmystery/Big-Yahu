# Bind mounts are relative to this file, so `docker compose up -d` works from a
# plain clone. HOST_WORKSPACE_FOLDER only needs setting when the Docker daemon
# runs outside this filesystem (e.g. a devcontainer talking to the host daemon),
# where it must hold the host-side path of this directory.

services:
  # No published port: only the bot talks to Chroma, and it does so over the
  # compose network by service name. Nothing is exposed to the host.
  chromadb:
    # Stable release verified against the publisher's release and image digest.
    # Existing deployments can keep their current image via CHROMA_IMAGE.
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6}
    restart: unless-stopped
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      - chromadb
    # Host side only. The container always listens on 3000, matching PORT below,
    # so nothing inside has to change — and nobody has to edit this file to move
    # the panel, which is a local edit that collides with every pull.
    #
    #   HOST_PORT=8080            reachable on every interface, port 8080
    #   HOST_PORT=127.0.0.1:8080  reachable only from this machine
    ports:
      - "${HOST_PORT:-3000}:3000"
    # DISCORD_TOKEN, DISCORD_GUILD_ID and OPENROUTER_API_KEY come from here.
    env_file:
      - .env
    environment:
      # Set after env_file, so these win over whatever .env holds. Chroma is
      # reached by service name on the compose network, so it needs no
      # configuring by hand and no port on the host. The SQLite file lives on
      # the mounted volume rather than inside the image.
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      SQLITE_PATH: /app/data/big-yahu.sqlite3
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - ${HOST_WORKSPACE_FOLDER:-.}/data:/app/data
